[project]
name = "quantforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vishwajit Vishnu", email = "vishwajit.vishnu@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
]

[project.scripts]
quantforge = "quantforge:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
